{% extends 'layout.html' %}
{% block content %}
<h3>Типы активностей</h3>

<!-- Добавление -->
<form method="post" action="{{ url_for('add_activity_type') }}" class="card p-3 mb-4 shadow-sm">
  <div class="row g-2 align-items-end">
    <div class="col-md-8">
      <label class="form-label">Название нового типа активности</label>
      <input type="text" name="name" class="form-control" placeholder="Например: Отчёт, Командировка..." required>
    </div>
    <div class="col-md-4">
      <button class="btn btn-success w-100">Добавить</button>
    </div>
  </div>
</form>

<!-- Таблица -->
<table class="table table-striped align-middle">
  <thead>
    <tr>
      <th>ID</th>
      <th>Название</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for t in types %}
    <tr>
      <td>{{ t.id }}</td>
      <td>{{ t.name }}</td>
      <td>
        <!-- Редактировать -->
        <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#editModal{{ t.id }}">
          ✏️ Редактировать
        </button>

        <!-- Удалить -->
        <form method="post" action="{{ url_for('delete_activity_type', type_id=t.id) }}" class="d-inline">
          <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить тип активности?')">🗑 Удалить</button>
        </form>
      </td>
    </tr>

    <!-- Модалка -->
    <div class="modal fade" id="editModal{{ t.id }}" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form method="post" action="{{ url_for('edit_activity_type', type_id=t.id) }}">
            <div class="modal-header">
              <h5 class="modal-title">Редактировать тип активности</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <label class="form-label">Название</label>
              <input type="text" name="name" class="form-control" value="{{ t.name }}" required>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
              <button class="btn btn-primary">Сохранить</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    {% endfor %}
  </tbody>
</table>

{% endblock %}
