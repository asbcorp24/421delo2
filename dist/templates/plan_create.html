{% extends 'layout.html' %}
{% block content %}
<div class="container mt-4">
  <h3>📅 Создание нового плана</h3>

  <form method="POST" action="{{ url_for('plan_create') }}" class="border rounded-3 p-4 bg-light mt-3">

    <div class="row mb-3">
      <div class="col">
        <label class="form-label">Дата начала</label>
        <input type="date" name="start_date" class="form-control" required>
      </div>
      <div class="col">
        <label class="form-label">Дата окончания</label>
        <input type="date" name="end_date" class="form-control" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Описание плана</label>
      <textarea name="plan_text" rows="5" class="form-control" placeholder="Опишите цель, задачи и ожидаемые результаты..." required></textarea>
    </div>

    <div class="text-end">
      <a href="{{ url_for('plans_list') }}" class="btn btn-secondary">Отмена</a>
      <button type="submit" class="btn btn-success">💾 Сохранить план</button>
    </div>
  </form>
</div>
{% endblock %}
