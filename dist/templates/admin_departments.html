{% extends 'layout.html' %}
{% block content %}
<h3>Отделы предприятия</h3>

<!-- Форма добавления -->
<form method="post" action="{{ url_for('add_department') }}" class="card p-3 mb-4 shadow-sm">
  <div class="row g-2 align-items-end">
    <div class="col-md-8">
      <label class="form-label">Название нового отдела</label>
      <input type="text" name="name" class="form-control" placeholder="Например: Бухгалтерия" required>
    </div>
    <div class="col-md-4">
      <button class="btn btn-success w-100">Добавить</button>
    </div>
  </div>
</form>

<!-- Таблица отделов -->
<table class="table table-striped align-middle">
  <thead>
    <tr>
      <th>ID</th>
      <th>Название</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for d in deps %}
    <tr>
      <td>{{ d.id }}</td>
      <td>{{ d.name }}</td>
      <td>
        <!-- Кнопка редактирования (открывает модалку) -->
        <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#editModal{{ d.id }}">
          ✏️ Редактировать
        </button>

        <!-- Удаление -->
        <form method="post" action="{{ url_for('delete_department', dep_id=d.id) }}" class="d-inline">
          <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить отдел?')">🗑 Удалить</button>
        </form>
      </td>
    </tr>

    <!-- Модалка редактирования -->
    <div class="modal fade" id="editModal{{ d.id }}" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form method="post" action="{{ url_for('edit_department', dep_id=d.id) }}">
            <div class="modal-header">
              <h5 class="modal-title">Редактировать отдел</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <label class="form-label">Название</label>
              <input type="text" name="name" class="form-control" value="{{ d.name }}" required>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
              <button class="btn btn-primary">Сохранить</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
