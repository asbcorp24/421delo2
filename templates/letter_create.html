{% extends 'layout.html' %}
{% block content %}
<h3 class="mb-3">📨 Создание письма</h3>

<form method="post" action="{{ url_for('add_letter') }}" enctype="multipart/form-data">
  <div class="mb-3">
    <label class="form-label">Тема письма</label>
 <input type="text" name="subject" class="form-control"
       value="{{ subject or '' }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Дата письма</label>
    <input type="date" name="letter_date" class="form-control" value="{{ now().strftime('%Y-%m-%d') }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Содержание письма</label>
   <textarea name="body" class="form-control" rows="5">{{ body or '' }}</textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Выберите отделы для направления</label>
    <select name="departments" class="form-select" multiple>
      {% for d in deps %}
        <option value="{{ d.id }}">{{ d.name }}</option>
      {% endfor %}
    </select>
    <div class="form-text">Можно выбрать несколько отделов.</div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <label class="form-label">Исполнители</label>
      <select name="executors" class="form-select" multiple>
        {% for u in users %}
          <option value="{{ u.id }}">{{ u.full_name }} ({{ u.department.name if u.department else '' }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Для ознакомления</label>
      <select name="observers" class="form-select" multiple>
        {% for u in users %}
          <option value="{{ u.id }}">{{ u.full_name }} ({{ u.department.name if u.department else '' }})</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="mt-3 text-end">
    <button type="submit" class="btn btn-primary">💾 Создать письмо</button>
    <a href="{{ url_for('letters_page') }}" class="btn btn-secondary">Отмена</a>
  </div>
</form>
{% endblock %}
