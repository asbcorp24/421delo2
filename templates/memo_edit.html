{% extends 'layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Редактирование служебной записки</h3>
  <a href="{{ url_for('memo_view', memo_id=memo.id) }}" class="btn btn-outline-secondary">Отмена</a>
</div>
<form method="post" class="card bg-dark border-info p-3 shadow-sm">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Номер служебной записки</label><input name="reg_number" class="form-control" value="{{ memo.reg_number or '' }}" required></div>
    <div class="col-md-4"><label class="form-label">Дата</label><input type="date" name="memo_date" class="form-control" value="{{ memo.letter_date.strftime('%Y-%m-%d') if memo.letter_date else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Отдел</label><select name="department_id" class="form-select" required>{% for department in departments %}<option value="{{ department.id }}" {% if department in memo.departments %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></div>
    <div class="col-md-8"><label class="form-label">Краткое содержание</label><input name="subject" class="form-control" value="{{ memo.subject or '' }}" required></div>
    <div class="col-md-4"><label class="form-label">Исполнитель</label><select name="executor_id" class="form-select"><option value="">Не назначен</option>{% for user in users %}<option value="{{ user.id }}" {% if memo.executor_id == user.id %}selected{% endif %}>{{ user.full_name }}{% if user.department %} ({{ user.department.name }}){% endif %}</option>{% endfor %}</select></div>
    <div class="col-12"><label class="form-label">Текст служебной записки</label><textarea name="body" class="form-control" rows="10">{{ memo.body or '' }}</textarea></div>
  </div>
  <div class="text-end mt-3"><button class="btn btn-success">Сохранить изменения</button></div>
</form>
{% endblock %}
