{% extends 'layout.html' %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 760px;">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0">Редактирование пользователя</h3>
      <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">К списку</a>
    </div>
    <p class="text-muted">ID: {{ user.id }}. Оставьте пароль пустым, если менять его не требуется.</p>
    <form method="post" class="row g-3">
      <div class="col-md-7">
        <label class="form-label">ФИО</label>
        <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
      </div>
      <div class="col-md-5">
        <label class="form-label">Логин</label>
        <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Новый пароль</label>
        <input type="text" name="password" class="form-control" autocomplete="new-password" placeholder="Не изменять">
      </div>
      <div class="col-md-6">
        <label class="form-label">Отдел</label>
        <select name="department_id" class="form-select">
          <option value="">-- не указан --</option>
          {% for department in departments %}
          <option value="{{ department.id }}" {% if user.department_id == department.id %}selected{% endif %}>{{ department.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Роль</label>
        <select name="role" class="form-select">
          {% for role in ['worker', 'deputy', 'manager', 'admin'] %}
          {% if role in allowed_roles %}
          <option value="{{ role }}" {% if user.role == role %}selected{% endif %}>{{ {'worker': 'Сотрудник', 'deputy': 'Заместитель', 'manager': 'Руководитель', 'admin': 'Администратор'}[role] }}</option>
          {% endif %}
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" name="is_approved" value="1" id="isApproved" {% if user.is_approved %}checked{% endif %}>
          <label class="form-check-label" for="isApproved">Учётная запись подтверждена</label>
        </div>
      </div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-success">Сохранить изменения</button>
        <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
