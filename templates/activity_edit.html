{% extends 'layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Редактирование задачи #{{ activity.id }}</h3>
  <a href="{{ url_for('activity_view', activity_id=activity.id) }}" class="btn btn-outline-secondary">Отмена</a>
</div>
<form method="post" class="card bg-dark border-info p-3 shadow-sm">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Название</label><input name="title" class="form-control" value="{{ activity.title }}" required></div>
    <div class="col-md-3"><label class="form-label">Исполнитель</label><select name="owner_id" class="form-select" required>{% for user in users %}<option value="{{ user.id }}" {% if activity.owner_id == user.id %}selected{% endif %}>{{ user.full_name }}{% if user.department %} ({{ user.department.name }}){% endif %}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Тип</label><select name="type_id" class="form-select"><option value="">Не указан</option>{% for type in types %}<option value="{{ type.id }}" {% if activity.type_id == type.id %}selected{% endif %}>{{ type.name }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Приоритет</label><select name="priority" class="form-select">{% for value, meta in {1: 'Низкий', 2: 'Обычный', 3: 'Средний', 4: 'Высокий', 5: 'Критический'}.items() %}<option value="{{ value }}" {% if (activity.priority or 3) == value %}selected{% endif %}>{{ value }} - {{ meta }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Сложность</label><select name="complexity_level" class="form-select">{% for value, label in {1: 'Простая', 2: 'Базовая', 3: 'Средняя', 4: 'Высокая', 5: 'Критическая'}.items() %}<option value="{{ value }}" {% if (activity.complexity_level or 3) == value %}selected{% endif %}>{{ value }} - {{ label }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Статус</label><select name="status" class="form-select">{% for code, meta in status_meta.items() %}<option value="{{ code }}" {% if activity.status == code %}selected{% endif %}>{{ meta.label }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Дата начала</label><input type="date" name="start_date" class="form-control" value="{{ activity.start_date.strftime('%Y-%m-%d') if activity.start_date else '' }}"></div>
    <div class="col-md-3"><label class="form-label">Дата окончания</label><input type="date" name="end_date" class="form-control" value="{{ activity.end_date.strftime('%Y-%m-%d') if activity.end_date else '' }}"></div>
    <div class="col-md-3"><label class="form-label">Тема</label><input name="direction" class="form-control" value="{{ activity.direction or '' }}"></div>
    <div class="col-12"><label class="form-label">Исходный документ</label><input name="outgoing_document" class="form-control" value="{{ activity.outgoing_document or '' }}"></div>
    <div class="col-12"><label class="form-label">Описание</label><textarea name="description" class="form-control" rows="6">{{ activity.description or '' }}</textarea></div>
  </div>
  <div class="text-end mt-3"><button class="btn btn-success">Сохранить изменения</button></div>
</form>
{% endblock %}
